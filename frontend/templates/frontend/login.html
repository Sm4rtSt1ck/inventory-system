{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Equipment Inventory</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'frontend/css/app.css' %}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <p class="brand"><i class="bi bi-pc-display-horizontal me-1"></i> Equipment Inventory</p>
        <p class="subtitle">University Department System</p>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size:.82rem">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" style="font-size:.82rem">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btn-login">Sign in</button>
            <div id="login-error" class="text-danger mt-2 text-center" style="font-size:.82rem;display:none"></div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    if (localStorage.getItem('access')) window.location.href = '/';

    document.getElementById('login-form').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.disabled = true; btn.textContent = 'Signing in…';

        const body = new FormData(e.target);
        const res = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: body.get('username'), password: body.get('password') }),
        });

        if (res.ok) {
            const tokens = await res.json();
            localStorage.setItem('access', tokens.access);
            localStorage.setItem('refresh', tokens.refresh);

            // Fetch user info
            const me = await fetch('/api/auth/me/', { headers: { Authorization: `Bearer ${tokens.access}` } });
            if (me.ok) localStorage.setItem('user', JSON.stringify(await me.json()));

            window.location.href = '/';
        } else {
            const err = await res.json().catch(() => ({}));
            const msg = err.detail || 'Invalid credentials';
            const errEl = document.getElementById('login-error');
            errEl.textContent = msg; errEl.style.display = '';
            btn.disabled = false; btn.textContent = 'Sign in';
        }
    });
</script>
</body>
</html>
