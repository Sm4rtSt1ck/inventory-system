{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Persons{% endblock %}

{% block content %}
<div class="page-header">
    <h4><i class="bi bi-people me-2 text-secondary"></i>Persons</h4>
    <button class="btn btn-primary btn-sm d-none" id="btn-add" data-bs-toggle="modal" data-bs-target="#modal-add">
        <i class="bi bi-plus-lg me-1"></i>Add Person
    </button>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table mb-0">
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Role</th>
                    <th>Email</th>
                    <th style="width:60px"></th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="4" class="spinner-overlay">
                    <div class="spinner-border spinner-border-sm text-secondary"></div>
                </td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Person Modal -->
<div class="modal fade" id="modal-add" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Person</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-person">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input name="full_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            <option value="lab_manager">Lab Manager</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">Email</label>
                        <input name="email" type="email" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/persons.js' %}"></script>
{% endblock %}
