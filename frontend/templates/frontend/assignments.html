{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Assignments{% endblock %}

{% block content %}
<div class="page-header">
    <div class="d-flex align-items-center gap-3">
        <h4 class="mb-0"><i class="bi bi-clipboard-check me-2 text-secondary"></i>Assignments</h4>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-primary" id="toggle-active">Active</button>
            <button class="btn btn-outline-secondary" id="toggle-all">All</button>
        </div>
    </div>
    <button class="btn btn-primary btn-sm d-none" id="btn-add" data-bs-toggle="modal" data-bs-target="#modal-add">
        <i class="bi bi-plus-lg me-1"></i>New Assignment
    </button>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table mb-0">
            <thead>
                <tr>
                    <th>Equipment</th>
                    <th>Laboratory</th>
                    <th>Person</th>
                    <th>Role</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="7" class="spinner-overlay">
                    <div class="spinner-border spinner-border-sm text-secondary"></div>
                </td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- New Assignment Modal -->
<div class="modal fade" id="modal-add" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Assignment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-assignment">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Equipment</label>
                            <select name="equipment" id="sel-equipment" class="form-select" required>
                                <option value="">— select equipment —</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Laboratory</label>
                            <select name="laboratory" id="sel-lab" class="form-select" required>
                                <option value="">— select laboratory —</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Responsible Person</label>
                            <select name="person" id="sel-person" class="form-select" required>
                                <option value="">— select person —</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Date From</label>
                            <input name="date_from" type="date" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Date To <span class="text-muted">(optional)</span></label>
                            <input name="date_to" type="date" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/assignments.js' %}"></script>
{% endblock %}
