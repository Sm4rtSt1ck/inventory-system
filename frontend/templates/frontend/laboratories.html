{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Laboratories{% endblock %}

{% block content %}
<div class="page-header">
    <h4><i class="bi bi-building me-2 text-secondary"></i>Laboratories</h4>
    <button class="btn btn-primary btn-sm d-none" id="btn-add" data-bs-toggle="modal" data-bs-target="#modal-add">
        <i class="bi bi-plus-lg me-1"></i>Add Laboratory
    </button>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table mb-0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Room</th>
                    <th>Building</th>
                    <th style="width:60px"></th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="4" class="spinner-overlay">
                    <div class="spinner-border spinner-border-sm text-secondary"></div>
                </td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Laboratory Modal -->
<div class="modal fade" id="modal-add" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Laboratory</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-lab">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Room</label>
                        <input name="room" class="form-control" required placeholder="e.g. 101">
                    </div>
                    <div class="mb-1">
                        <label class="form-label">Building</label>
                        <input name="building" class="form-control" required placeholder="e.g. Main Building">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/laboratories.js' %}"></script>
{% endblock %}
