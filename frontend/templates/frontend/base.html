{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Equipment Inventory{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'frontend/css/app.css' %}">
</head>
<body>
<div class="d-flex">

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <p class="brand"><i class="bi bi-pc-display-horizontal me-1"></i> Equipment Inventory</p>
            <span class="user-badge" id="user-badge">loading…</span>
        </div>

        <div class="sidebar-section">Inventory</div>
        <ul class="nav flex-column">
            <li><a class="nav-link" href="/"><i class="bi bi-pc-display"></i> Equipment</a></li>
            <li><a class="nav-link" href="/assignments/"><i class="bi bi-clipboard-check"></i> Assignments</a></li>
        </ul>

        <div class="sidebar-section">Directory</div>
        <ul class="nav flex-column">
            <li><a class="nav-link" href="/laboratories/"><i class="bi bi-building"></i> Laboratories</a></li>
            <li><a class="nav-link" href="/persons/"><i class="bi bi-people"></i> Persons</a></li>
        </ul>

        <div class="sidebar-footer">
            <button class="btn btn-sm btn-outline-secondary w-100" onclick="logout()">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
        </div>
    </nav>

    <!-- Main content -->
    <main class="content-area w-100">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'frontend/js/api.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
